<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc">
<title id="title">使徒信经：从创造到再临的救恩路线</title><desc id="desc">原创教学插画。沿着纸上金色路线，依次呈现创造的山水、应许的书卷、道成肉身的城与马槽、十字架和空墓、再临与新创造的盼望。不描绘父神；图像只作经文事件的记忆辅助。</desc>
<defs><linearGradient id="paper" x2="1" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#f0eadb"/></linearGradient><linearGradient id="sky" x2="0" y2="1"><stop stop-color="#d6e9e9"/><stop offset="1" stop-color="#fdf6e8"/></linearGradient><filter id="shadow"><feDropShadow dx="0" dy="7" stdDeviation="7" flood-color="#284e46" flood-opacity=".12"/></filter><pattern id="grain" width="11" height="13" patternUnits="userSpaceOnUse"><circle cx="2" cy="3" r=".6" fill="#8d754d" opacity=".09"/></pattern></defs>
<rect width="1200" height="500" rx="24" fill="url(#paper)"/><rect width="1200" height="500" rx="24" fill="url(#grain)"/>
<g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="45" y="51" font-size="18" font-weight="700" letter-spacing="3" fill="#48685b">使徒信经 · 救恩故事</text><text x="45" y="91" font-size="31" font-weight="700" fill="#234b41">我所信的，是在历史中施行救恩的上帝</text>
<path d="M75 344 C155 408 200 401 270 334 S413 293 486 341 S633 403 712 335 S844 303 925 341 S1040 397 1131 328" fill="none" stroke="#c8a554" stroke-width="8" stroke-linecap="round" stroke-dasharray="3 16" opacity=".8"/>
<!-- Creation: landscapes rather than a depiction of God. -->
<g transform="translate(36 128)" filter="url(#shadow)"><path d="M8 115 Q100 -2 198 114 L196 186 Q90 211 8 185Z" fill="url(#sky)"/><circle cx="151" cy="54" r="22" fill="#d7ad55"/><path d="M3 173 66 78 104 135 140 104 203 180Z" fill="#779b8a"/><path d="M3 181 59 130 112 163 156 144 202 182V200H3Z" fill="#315f51"/><path d="M113 164 Q75 185 124 201 Q158 217 111 236" fill="none" stroke="#729cab" stroke-width="18"/><path d="M26 141v-47m-18 24 18-29 18 29m-36 11 18-26 18 26" fill="none" stroke="#234b41" stroke-width="5" stroke-linecap="round"/></g>
<!-- Promise scroll. -->
<g transform="translate(273 151) rotate(-5 87 85)" filter="url(#shadow)"><path d="M13 29H161V175H12Q36 162 22 147V45Z" fill="#fbefd0" stroke="#aa8641" stroke-width="3"/><path d="M12 29Q-4 28 0 48Q1 62 24 58M161 175q29 7 27-15-2-14-26-12" fill="#e7d09c" stroke="#aa8641" stroke-width="3"/><path d="M48 71h84m-84 23h65m-65 23h78" stroke="#8d7952" stroke-width="5" stroke-linecap="round"/><path d="m82 139 8-16 7 16 18 3-13 11 3 17-15-8-15 8 3-17-13-11Z" fill="#c59c49"/></g>
<!-- Incarnation: Bethlehem-style silhouettes and manger. -->
<g transform="translate(499 144)" filter="url(#shadow)"><path d="M4 109 103 23 199 109V201H4Z" fill="#e3d9c5"/><path d="M18 112 103 41 183 112" fill="none" stroke="#876c4b" stroke-width="9" stroke-linecap="round"/><path d="M68 199v-65q35-55 70 0v65" fill="#384d47"/><path d="m86 146 12 47m26-47-12 47m-33-49h51l-10 23H89Z" stroke="#d3b06b" fill="#b38b4c" stroke-width="5"/><path d="m102 1 4 13 13 4-13 4-4 13-4-13-13-4 13-4Z" fill="#c49c48"/><path d="M6 167h-25v-54h24m194 66h23v-59h-24" fill="#bbab8e"/></g>
<!-- Cross and empty tomb. -->
<g transform="translate(742 138)" filter="url(#shadow)"><path d="M-6 207q47-46 97-19 51-76 115 10v17H-6Z" fill="#8ba18c"/><path d="M41 166V32m-32 40h65" stroke="#6d4d3c" stroke-width="11" stroke-linecap="round"/><path d="M95 192v-45q36-77 91 0v45Z" fill="#b9b5a3" stroke="#65766c" stroke-width="3"/><path d="M121 192v-40q21-39 42 0v40" fill="#345c56"/><path d="M128 188h30" stroke="#f4e6b9" stroke-width="6"/><ellipse cx="192" cy="174" rx="20" ry="31" fill="#d3cbbc" stroke="#7a877b" stroke-width="3"/></g>
<!-- Consummation, without a visual portrayal of divine persons. -->
<g transform="translate(990 137)" filter="url(#shadow)"><path d="M5 199Q96 168 173 199V222H5Z" fill="#608778"/><path d="M40 198V92Q88 32 137 92V198" fill="#e8d8a9" stroke="#b18c42" stroke-width="4"/><path d="M63 196V105Q89 73 114 105V196" fill="#fff7db"/><path d="M15 131V94h23v104m100 0V94h23v37" fill="#c9bb92"/><path d="M83 16v25m-40-8 16 19m64-19-16 19M17 62l23 12m117-12-23 12" stroke="#cfac58" stroke-width="4" stroke-linecap="round"/><path d="M-1 209q74 29 175 0" fill="none" stroke="#8daebe" stroke-width="9"/></g>
<g font-size="52" font-weight="700" text-anchor="middle"><text x="132" y="408" fill="#315f51">创造</text><text x="361" y="408" fill="#946b28">应许</text><text x="601" y="408" fill="#315f51">道成肉身</text><text x="844" y="408" fill="#315f51">十架复活</text><text x="1080" y="408" fill="#946b28">再临</text></g><g font-size="20" text-anchor="middle" fill="#52695f"><text x="132" y="438">世界属于祂</text><text x="361" y="438">救主必来</text><text x="601" y="438">真神成为真人</text><text x="844" y="438">救恩已经成就</text><text x="1080" y="438">万有终必更新</text></g><text x="45" y="478" font-size="14" fill="#6c7568">记忆路线：父的创造与护理 → 子的降卑与升高 → 圣灵施恩、教会与永生。插画为事件记忆辅助。</text></g></svg>
