<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">尼西亚信经：会议城市与教义传承</title><desc id="desc">原创东地中海历史示意图，展示亚历山大、尼西亚、君士坦丁堡、迦克墩、安提阿和耶路撒冷的大致相对位置。路线连接325年尼西亚、381年君士坦丁堡和451年迦克墩。451年会议承认此前信经并进一步界定基督两性。此图不是精确古疆界。</desc>
