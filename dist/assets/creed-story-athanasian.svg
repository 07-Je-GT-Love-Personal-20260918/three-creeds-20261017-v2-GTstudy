<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">亚他那修信经：三一与基督两性的术语关系</title><desc id="desc">原创教学书页插画。左页整理一体三位的信仰用语：父、子、圣灵，位格有别，同一神性，本质不分。右页整理主耶稣基督具有完整神性和完整人性，两性不混不变不分不离。这是术语关系示意，不是神的形象、构造图或物体类比。</desc><defs><linearGradient id="paper" x2="0" y2="1"><stop stop-color="#fffaf0"/><stop offset="1" stop-color="#eee5d1"/></linearGradient><linearGradient id="fold"><stop stop-color="#b5a482" stop-opacity="0"/><stop offset=".5" stop-color="#8b7755" stop-opacity=".18"/><stop offset="1" stop-color="#b5a482" stop-opacity="0"/></linearGradient><filter id="shadow"><feDropShadow dy="9" stdDeviation="9" flood-color="#2e483d" flood-opacity=".15"/></filter></defs><rect width="1200" height="500" rx="24" fill="#f1ecdf"/><g font-family="'Microsoft YaHei','PingFang SC',sans-serif"><text x="42" y="45" font-size="18" font-weight="700" letter-spacing="3" fill="#48685b">亚他那修信经 · 术语关系</text><text x="42" y="85" font-size="31" font-weight="700" fill="#234b41">敬拜三一上帝，承认同一位基督</text>
<!-- The book presents terms; it is not an analogy for the divine being. -->
<g filter="url(#shadow)"><path d="M52 135Q292 95 600 133q281-41 548 2v299q-270-39-548-2-285-37-548 2Z" fill="#737568"/><path d="M52 124Q292 84 600 122q281-41 548 2v299q-270-39-548-2-285-37-548 2Z" fill="url(#paper)" stroke="#c9b994" stroke-width="2"/><path d="M570 121q30 10 60-2v303q-29-9-60 1Z" fill="url(#fold)"/><path d="M600 124v295" stroke="#b6a789" stroke-width="2"/></g>
<text x="104" y="169" font-size="52" font-weight="700" fill="#315f51">一体三位</text><path d="M105 184h441" stroke="#c9b276" stroke-width="2"/><g font-size="42" font-weight="700" text-anchor="middle" fill="#315f51"><text x="178" y="229">父</text><text x="324" y="229">子</text><text x="471" y="229">圣灵</text></g><g stroke="#87a398" stroke-width="2" fill="none"><path d="M131 245h94m52 0h94m52 0h94"/><path d="M178 258v20h293v-20M324 278v14"/></g><rect x="160" y="295" width="328" height="54" rx="13" fill="#e1ebe3"/><text x="324" y="331" text-anchor="middle" font-size="32" font-weight="700" fill="#315f51">同一神性</text><text x="324" y="389" text-anchor="middle" font-size="22" fill="#5e6a5c">位格不混淆　｜　本质不分割</text>
<text x="653" y="169" font-size="52" font-weight="700" fill="#685981">一位二性</text><path d="M653 184h441" stroke="#c9b276" stroke-width="2"/><rect x="735" y="203" width="276" height="49" rx="12" fill="#e8e1ee"/><text x="873" y="235" text-anchor="middle" font-size="30" font-weight="700" fill="#625478">主耶稣基督</text><path d="M873 264v15M751 293v-14h244v14" fill="none" stroke="#9b8cab" stroke-width="2"/><g font-size="42" font-weight="700" text-anchor="middle" fill="#625478"><text x="751" y="324">完整神性</text><text x="995" y="324">完整人性</text></g><text x="873" y="366" text-anchor="middle" font-size="21" fill="#645e68">不混淆 · 不改变 · 不分割 · 不离散</text><text x="873" y="397" text-anchor="middle" font-size="16" fill="#767267">两性用语参照正统基督论；不把人性变成神性。</text>
<path d="M84 449h1032" stroke="#d3c8af" stroke-width="1"/><text x="600" y="478" text-anchor="middle" font-size="16" fill="#606c60">术语关系示意：书页仅承载教义文字，不是神的形象、构造图，也不是以物体解释三一的类比。</text></g></svg>
