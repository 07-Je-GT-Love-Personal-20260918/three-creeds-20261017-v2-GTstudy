<!doctype html><html lang="zh-Hans"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>使徒信经 · 清洁阅读版</title><link rel="icon" href="favicon.svg"><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="v2.css"></head><body class="clean-page"><nav class="clean-nav"><a href="index.html#memorize">← 记忆工坊</a><a href="library.html">六份原典</a><button onclick="window.print()">打印</button></nav><main class="clean-reader"><div class="reader-title"><div class="eyebrow">CREDO · 指定版本原文</div><h1>使徒信经</h1></div><div class="original-body"><p>我信神，全能的父，创造天地的主。</p>
<p>我信我主耶稣基督，神的独生子；因圣灵感孕，从童贞女马利亚所生；在本丢·彼拉多手下受难，被钉在十字架上，受死，被埋葬，降在阴间；第三天从死里复活；他升天，坐在全能父神的右边；将来必从那里降临，审判活人死人。</p>
<p>我信圣灵。</p>
<p>我相信圣而公之教会，我相信圣徒相通；</p>
<p>我相信罪得赦免；</p>
<p>我相信身体复活；</p>
<p>我相信永生。阿们！</p></div><footer class="original-meta">中文原文来源：<a href="https://ccifellowship.org/books/book-of-praise/creeds/apostles-creed" target="_blank" rel="noopener">ccifellowship.org</a><br>《敬拜手册》2015版 · 2026年10月17日核对<br>依据用户提供的文本与公开使用许可制作。仅调整阅读排版，不改正文。</footer></main></body></html>
