name: Publish Surge
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mirrors
  cancel-in-progress: true
jobs:
  surge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python build.py
      - name: Publish Surge
        run: npx --yes surge@0.44.6 ./dist three-creeds-20261021-v3-gtstudy.surge.sh
        env:
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
